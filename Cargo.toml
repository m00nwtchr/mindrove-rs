[package]
name = "mindrove"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["mindrove-sys"]

[dependencies]
mindrove-sys = { path = "./mindrove-sys" }
ndarray = { version = "0.16", features = ["serde"] }
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
native-tests = []
